# WAMP Router Configuration

[server]
# Port to listen on for TLS connections
port = 8080

# Router threads, one shard each (sessions are spread over them). 1 = the classic single-threaded router.
# "auto" = one per available CPU (container-aware: cgroup quota, CPU affinity, ECS task limit).
# Sessions on different shards still reach each other: pub/sub and RPC are routed across shards.
threads = 1

# A new connection must become an established WAMP session (TLS handshake, RawSocket/WebSocket
# handshake, HELLO and authentication all included) within this many milliseconds, or it is closed.
# Protects against clients that connect and stall. 0 disables the limit.
handshake_timeout_ms = 10000

[server.tls]
# Path to TLS certificate (PEM format)
cert = "/path/to/cert.pem"

# Path to TLS private key (PEM format)
key = "/path/to/key.pem"

# Optional: CA certificate for client verification (mutual TLS)
# ca = "/path/to/ca.pem"

# Optional: Require client certificates (mutual TLS)
# require_client_cert = false

[server.rpc]
# Maximum pending RPC invocations (LRU cache size)
# Controls how many concurrent CALL operations can be in flight
max_pending_invocations = 10000
# How long a callee may take to answer a CALL before the caller gets
# wamp.error.timeout (milliseconds, 0 = no timeout). A CALL's "timeout"
# option overrides it.
call_timeout_ms = 30000

[server.websocket]
# WebSocket (subprotocol wamp.2.cbor) on the same port: the router tells RawSocket and an HTTP upgrade
# apart by the first byte of the connection. TLS applies to both.
enabled = true
# Browsers send an Origin header. Empty = accept any origin; otherwise a request that carries an Origin
# must match one entry exactly (scheme://host[:port]). Requests without an Origin (non-browser clients) pass.
allowed_origins = []
# Largest WebSocket message in bytes (at most 16777215, the router's internal frame limit)
# max_message_size = 16777215

[server.events]
# Per-session queue of events/invocations/results waiting to be written to a client
queue_size = 100

# What to do when a client's queue is full:
#   "backpressure" - pause reading from the session that is sending until the client catches up
#                    (lossless; bounded by backpressure_timeout_ms)
#   "drop"         - discard the event and count it
overflow = "backpressure"

# Longest a sender waits for queue space before the event is dropped
backpressure_timeout_ms = 1000

# After this many consecutive backpressure timeouts a subscriber is treated as stalled: while its
# queue is full its events are dropped immediately, so it stops slowing down publishers. Any
# successful delivery clears the mark. 0 = never skip.
slow_subscriber_limit = 3

[logging]
# Log level: trace, debug, info, warn, error, critical
level = "info"
# async = true: a background thread writes the log, so a slow sink (full pipe, network disk) never stalls a
# shard. queue_size lines are buffered; when it is full the oldest line is dropped (counted at shutdown).
# async = false writes on the calling thread. Each line is tagged with its shard ("shard 2").
async = true
queue_size = 8192
# file = "/var/log/wamp_router.log"   # default: the console

[auth.keys]
# Authentication keys: authid → Ed25519 public key (hex-encoded, 64 characters)
# Generate keys with: openssl genpkey -algorithm ED25519 -out private.pem
# Extract public key hex: openssl pkey -in public.pem -pubin -text -noout
"user1" = "d75a980182b10ab7d54bfed3c964073a0ee172f3daa62325af021a68f707511a"
"admin" = "3d4017c3e843895a92b70aa74d1b7ebc9c982ccf2ec4968cc0cd55f12af4660c"

# Realms. Topics and procedures exist per realm: the same URI in two realms is two unrelated things.
# Once [auth.keys] is non-empty an authid may only join the realms listed here (an authid with no
# entry cannot join any). Without [auth.keys] clients may join any realm.
[auth.realms]
"user1" = ["realm1"]
"admin" = ["realm1", "realm2"]

# Authorization. Once [auth.keys] is non-empty, everything is denied unless a role allows it.
# Each authid is assigned one role; a role is a list of rules. Actions: call, register,
# publish, subscribe. match = "exact" (default) or "prefix" (also matches the prefix itself).
# Denied requests get wamp.error.not_authorized. An authid without a role can connect but do nothing.
# A role name applies in every realm the authid may join; a table gives a role per realm.
[auth.roles]
"user1" = "user"
"admin" = { realm1 = "admin", realm2 = "user" }

[[roles.user.rules]]
uri = "com.example."
match = "prefix"
allow = ["call", "publish", "subscribe"]

[[roles.admin.rules]]
uri = "com."
match = "prefix"
allow = ["call", "register", "publish", "subscribe"]
